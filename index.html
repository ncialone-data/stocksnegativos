<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stocks Negativos x Fábrica</title>
<style>
  :root {
    --red: #cc0000;
    --red-dark: #990000;
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e0e0e0;
    --text: #222;
    --muted: #666;
    --green: #1a7f37;
    --amber: #b8860b;
    --banner: #f2a154;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: white;
    padding: 20px 24px;
  }
  header h1 { margin: 0 0 4px 0; font-size: 22px; }
  header .sub { font-size: 13px; opacity: 0.9; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  #refreshBtn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #refreshBtn:hover { background: rgba(255,255,255,0.3); }
  #status { font-size: 13px; }
  .kpis {
    display: flex; gap: 12px; flex-wrap: wrap;
    padding: 16px 24px 0 24px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 150px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--red); }
  .kpi .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .kpi-evo {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 230px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .kpi-evo .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .kpi-evo .row { display:flex; align-items:baseline; gap:10px; }
  .kpi-evo .num { font-size: 22px; font-weight: 700; }
  .kpi-evo .delta { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .kpi-evo .delta.mejor { color: var(--green); background: #eaf6ec; }
  .kpi-evo .delta.peor { color: var(--red); background: #fdeaea; }
  .kpi-evo .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .tabs-primary {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 16px 24px 0 24px;
    border-bottom: 2px solid var(--red);
  }
  .tab-primary {
    padding: 9px 18px;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: #ececec;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .tab-primary.active {
    background: var(--red);
    color: white;
    border-color: var(--red);
  }
  .tab-primary .count {
    display: inline-block; margin-left: 6px;
    background: rgba(0,0,0,0.08); border-radius: 10px; padding: 0 6px; font-size: 11px;
  }
  .tab-primary.active .count { background: rgba(255,255,255,0.25); }
  .tab-primary.empty { opacity: 0.45; }
  .tab-primary.new-tab { background: #fff8e6; border-color: var(--amber); color: var(--amber); }
  .tab-primary.new-tab.active { background: var(--amber); border-color: var(--amber); color: white; }

  .tabs-secondary {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 10px 24px;
    background: #fdf0f0;
    border-bottom: 1px solid var(--border);
  }
  .tab-secondary {
    padding: 5px 12px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
  }
  .tab-secondary.active {
    background: var(--red-dark);
    color: white;
    border-color: var(--red-dark);
  }
  .tab-secondary.all-btn.active { background: #333; border-color: #333; }
  .tab-secondary .count {
    display: inline-block; margin-left: 5px;
    background: rgba(0,0,0,0.08); border-radius: 10px; padding: 0 5px; font-size: 10px;
  }
  .tab-secondary.active .count { background: rgba(255,255,255,0.25); }
  .tab-secondary.empty { opacity: 0.45; }

  main { padding: 16px 24px 8px 24px; }
  .sub-banner {
    background: var(--banner);
    color: white;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    margin: 18px 0 10px 0;
  }
  .sub-banner:first-child { margin-top: 0; }
  .familia-block {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .familia-title {
    background: #fafafa;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    border-bottom: 1px solid var(--border);
  }
  table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid #f0f0f0;
    overflow-wrap: break-word;
    word-break: break-word;
    vertical-align: top;
  }
  th {
    background: #fbfbfb;
    color: var(--muted);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  tr:last-child td { border-bottom: none; }
  .neg { color: var(--red); font-weight: 700; }
  .ocdif-cubierto { color: var(--green); font-weight: 600; }
  .ocdif-falta { color: var(--red); font-weight: 600; }
  .muted { color: var(--muted); }
  .empty-msg {
    text-align: center; padding: 40px; color: var(--muted); font-size: 14px;
  }
  #errorBanner {
    display: none;
    background: #fff3cd; border: 1px solid #ffe69c; color: #664d03;
    padding: 10px 16px; margin: 16px 24px 0 24px; border-radius: 8px; font-size: 13px;
  }
  #loadingBanner {
    padding: 40px; text-align: center; color: var(--muted);
  }
  .totales-footer {
    margin: 8px 24px 32px 24px;
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    border-radius: 10px;
    padding: 14px 20px;
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 13px;
  }
  .totales-footer .item .num { font-size: 20px; font-weight: 700; color: #333; }
  .totales-footer .item .lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; }
  .totales-footer .evo { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .totales-footer .evo .delta { font-size: 12px; font-weight:700; padding:3px 10px; border-radius:12px; }
  .totales-footer .evo .delta.mejor { color: var(--green); background:#eaf6ec; }
  .totales-footer .evo .delta.peor { color: var(--red); background:#fdeaea; }
  .totales-footer .evo .lbl2 { font-size:11px; color:var(--muted); }

  .tbl-main col.c-cod { width: 9%; }
  .tbl-main col.c-desc { width: 33%; }
  .tbl-main col.c-stock { width: 12%; }
  .tbl-main col.c-oc { width: 16%; }
  .tbl-main col.c-saldo { width: 15%; }
  .tbl-main col.c-ocdif { width: 15%; }
  .tbl-new col.c-cod { width: 10%; }
  .tbl-new col.c-desc { width: 44%; }
  .tbl-new col.c-stock { width: 14%; }
  .tbl-new col.c-origen { width: 32%; }

  #captureBtn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    padding: 5px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  #captureBtn:hover { background: rgba(255,255,255,0.3); }
  #captureBtn:disabled { opacity: 0.6; cursor: default; }
  #captureMsg {
    display: none;
    font-size: 12px;
    background: rgba(255,255,255,0.2);
    padding: 4px 10px;
    border-radius: 6px;
  }

  /* Estilo compacto usado SOLO al generar la imagen para WhatsApp,
     para que se parezca al Excel (filas bajas, poco espacio entre bloques). */
  .capture-render {
    background: #ffffff;
    padding: 14px;
    width: 1180px;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
  }
  .capture-render .capture-title {
    background: #f4b183;
    color: #111;
    font-weight: 700;
    font-size: 18px;
    padding: 6px 12px;
    margin-bottom: 6px;
    border-radius: 4px;
  }
  .capture-render .capture-updated {
    font-size: 11px;
    color: #555;
    margin-bottom: 10px;
  }
  .capture-render main { padding: 0; }
  .capture-render .sub-banner {
    padding: 5px 10px;
    font-size: 13px;
    margin: 10px 0 4px 0;
    border-radius: 4px;
  }
  .capture-render .familia-block {
    border: 1px solid #ccc;
    border-radius: 0;
    margin-bottom: 3px;
  }
  .capture-render .familia-title {
    padding: 4px 10px;
    font-size: 12px;
    background: #ffe699;
  }
  .capture-render table { font-size: 11px; }
  .capture-render th, .capture-render td { padding: 3px 8px; }
  .capture-render .totales-footer {
    margin: 10px 0 0 0;
    padding: 8px 14px;
    gap: 20px;
  }
  .capture-render .totales-footer .num { font-size: 15px; }
</style>
</head>
<body>

<header>
  <h1>STOCKS NEGATIVOS x FÁBRICA</h1>
  <div class="sub">
    <span id="status">Cargando datos...</span>
    <button id="refreshBtn" onclick="loadAll()">↻ Actualizar ahora</button>
    <button id="captureBtn" onclick="captureCurrentView()">📷 Copiar imagen (WhatsApp)</button>
    <span id="captureMsg"></span>
  </div>
</header>

<div id="errorBanner"></div>

function csvUrl(gid) {
  return "https://docs.google.com/spreadsheets/d/e/" + SHEET_KEY + "/pub?gid=" + gid + "&single=true&output=csv";
}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (c === '\r') { /* ignore */ }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.length > 1 || (r[0] && r[0].trim())).map(r => {
    const obj = {};
    headers.forEach((h, idx) => { obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    return obj;
  });
}

function parseNum(s) {
  if (s === null || s === undefined) return 0;
  s = String(s).trim();
  if (s === '') return 0;
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function fmtNum(n) {
  return n.toLocaleString('es-AR', { maximumFractionDigits: 2 });
}

async function fetchCSV(gid) {
  const res = await fetch(csvUrl(gid), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  return parseCSV(text);
}

    const [stockRows, ocBarman, ocGrafica, ocTubos, ocVymat] = await Promise.all([
      fetchCSV(GIDS.STOCK_CENTRAL),
      fetchCSV(GIDS.OC_BARMAN),
      fetchCSV(GIDS.OC_GRAFICA),
      fetchCSV(GIDS.OC_TUBOS),
      fetchCSV(GIDS.OC_VYMAT),
    ]);

    const ocSets = { 'OC BARMAN': ocBarman, 'OC GRAFICA': ocGrafica, 'OC TUBOS': ocTubos, 'OC VYMAT': ocVymat };
    const ocMap = {};
    for (const [origen, rows] of Object.entries(ocSets)) {
      for (const r of rows) {
        const cod = (r['COD'] || '').trim();
        if (!cod) continue;
        if (!ocMap[cod]) ocMap[cod] = { saldoEnviar: 0, ords: new Set(), origenes: new Set() };
        ocMap[cod].saldoEnviar += parseNum(r['SALDO ENVIAR']);
        if (r['ORD COM']) ocMap[cod].ords.add(r['ORD COM'].trim());
        ocMap[cod].origenes.add(origen);
      }
    }

    const data = {};
    const sumaPorTab = {};
    TAB_ORDER.forEach(t => { data[t] = {}; sumaPorTab[t] = 0; (TAB_SUBS[t] || [t]).forEach(s => data[t][s] = {}); });
    let sumaSinClasificar = 0;
    const newCodes = [];
    let totalNegativos = 0;
    let sinCobertura = 0;
    let sumaNegativos = 0;

    for (const r of stockRows) {
      const cod = (r['CODIGO'] || '').trim();
      if (!cod) continue;
      const stockDisp = parseNum(r['STOCK DISPONIBLE']);
      if (stockDisp >= 0) continue;

      totalNegativos++;
      sumaNegativos += stockDisp;
      const desc = r['MATERIA PRIMA'] || '';
      const ocInfo = ocMap[cod];
      const saldoEnviar = ocInfo ? ocInfo.saldoEnviar : 0;
      const ords = ocInfo ? Array.from(ocInfo.ords).join(', ') : '';
      const ocDif = stockDisp + saldoEnviar;
      if (ocDif < 0) sinCobertura++;

      const rowData = { cod, desc, stockDisp, ords, saldoEnviar, ocDif };

      const clases = CLASSIFICATION[cod];
      if (!clases || clases.length === 0) {
        sumaSinClasificar += stockDisp;
        const origenOC = ocInfo ? Array.from(ocInfo.origenes).join(', ') : null;
        newCodes.push({ ...rowData, origen: origenOC || 'Sin OC asociada (detectado en STOCK CENTRAL)' });
      } else {
        for (const [tab, sub, familia] of clases) {
          if (!data[tab]) data[tab] = {};
          if (!data[tab][sub]) data[tab][sub] = {};
          const fam = familia || 'SIN FAMILIA';
          if (!data[tab][sub][fam]) data[tab][sub][fam] = [];
          data[tab][sub][fam].push(rowData);
          sumaPorTab[tab] = (sumaPorTab[tab] || 0) + stockDisp;
        }
      }
    }

    for (const tab of Object.keys(data)) {
      for (const sub of Object.keys(data[tab])) {
        for (const fam of Object.keys(data[tab][sub])) {
          data[tab][sub][fam].sort((a, b) => a.stockDisp - b.stockDisp);
        }
      }
    }
    newCodes.sort((a, b) => a.stockDisp - b.stockDisp);

    STATE = { data, newCodes, totalNegativos, sinCobertura, sumaNegativos, sumaPorTab, sumaSinClasificar };
    renderPrimaryTabs();
    renderSecondaryTabs();
    renderActive();
    updateKPIs();
    await loadHistorial();
    renderTotalesFooter();

    const now = new Date().toLocaleString('es-AR');
    document.getElementById('status').textContent = 'Actualizado: ' + now;
    document.getElementById('kpis').style.display = 'flex';
  } catch (err) {
    console.error(err);
    document.getElementById('errorBanner').textContent = 'No se pudo actualizar la información: ' + err.message + '. Verificá la conexión o que el Google Sheets siga publicado.';
    document.getElementById('errorBanner').style.display = 'block';
    document.getElementById('status').textContent = 'Error al actualizar';
  } finally {
    document.getElementById('refreshBtn').disabled = false;
  }
}

async function loadHistorial() {
  const evoHoy = document.getElementById('evoHoy');
  const evoDelta = document.getElementById('evoDelta');
  const evoSub = document.getElementById('evoSub');
  evoHoy.textContent = fmtNum(STATE.sumaNegativos);

  if (!GIDS.HISTORIAL) {
    evoDelta.style.display = 'none';
    evoSub.textContent = 'Conectá la pestaña HISTORIAL para ver esta comparación.';
    HISTORIAL_ROWS = null;
    return;
  }
  try {
    HISTORIAL_ROWS = await fetchCSV(GIDS.HISTORIAL);
    HISTORIAL_ERROR = null;
  } catch (err) {
    console.error(err);
    HISTORIAL_ROWS = null;
    HISTORIAL_ERROR = err.message;
    evoSub.textContent = 'No se pudo leer HISTORIAL.';
    return;
  }
  if (!HISTORIAL_ROWS.length) { evoSub.textContent = 'Todavía no hay registros en HISTORIAL.'; return; }

  const prevRow = findPrevRow(HISTORIAL_ROWS);
  if (!prevRow) { evoSub.textContent = 'Todavía no hay un registro anterior a hoy para comparar.'; return; }

  const colName = HISTORIAL_ROWS[0].hasOwnProperty('TOTAL') ? 'TOTAL' : 'TOTAL NEGATIVO';
  const ayer = parseNum(prevRow[colName]);
  const hoy = STATE.sumaNegativos;
  pintarDelta(evoDelta, hoy, ayer);
  evoSub.textContent = 'Último registro (' + (prevRow['FECHA'] || '—') + '): ' + fmtNum(ayer);
}

function findPrevRow(rows) {
  const todayStr = new Date().toISOString().slice(0,10);
  for (let i = rows.length - 1; i >= 0; i--) {
    const fecha = (rows[i]['FECHA'] || '').trim();
    if (fecha && fecha.slice(0,10) !== todayStr) return rows[i];
  }
  return null;
}

function pintarDelta(el, hoy, ayer) {
  const delta = hoy - ayer; // positivo = menos negativo que ayer = mejoró
  el.style.display = 'inline-block';
  if (delta >= 0) {
    el.className = 'delta mejor';
    el.textContent = '▲ mejoró ' + fmtNum(Math.abs(delta));
  } else {
    el.className = 'delta peor';
    el.textContent = '▼ empeoró ' + fmtNum(Math.abs(delta));
  }
}

let activeTab = TAB_ORDER[0];
let activeSub = 'ALL';

function countTab(tab) {
  const subs = STATE.data[tab] || {};
  let total = 0;
  for (const sub of Object.keys(subs)) {
    for (const arr of Object.values(subs[sub])) total += arr.length;
  }
  return total;
}
function countSub(tab, sub) {
  const fams = (STATE.data[tab] || {})[sub] || {};
  return Object.values(fams).reduce((acc, arr) => acc + arr.length, 0);
}

function renderPrimaryTabs() {
  const el = document.getElementById('tabsPrimary');
  el.innerHTML = '';
  TAB_ORDER.forEach(tab => {
    const count = countTab(tab);
    const btn = document.createElement('button');
    btn.className = 'tab-primary' + (tab === activeTab ? ' active' : '') + (count === 0 ? ' empty' : '');
    btn.innerHTML = tab + ' <span class="count">' + count + '</span>';
    btn.onclick = () => {
      activeTab = tab;
      activeSub = 'ALL';
      renderPrimaryTabs(); renderSecondaryTabs(); renderActive(); renderTotalesFooter();
    };
    el.appendChild(btn);
  });
  const newBtn = document.createElement('button');
  const newCount = STATE.newCodes ? STATE.newCodes.length : 0;
  newBtn.className = 'tab-primary new-tab' + (activeTab === '__NEW__' ? ' active' : '');
  newBtn.innerHTML = '⚠ CÓDIGOS NUEVOS ENCONTRADOS <span class="count">' + newCount + '</span>';
  newBtn.onclick = () => { activeTab = '__NEW__'; renderPrimaryTabs(); renderSecondaryTabs(); renderActive(); renderTotalesFooter(); };
  el.appendChild(newBtn);
}

function renderSecondaryTabs() {
  const el = document.getElementById('tabsSecondary');
  const subs = TAB_SUBS[activeTab] || [];
  if (activeTab === '__NEW__' || subs.length <= 1) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  el.style.display = 'flex';
  el.innerHTML = '';

  const allCount = subs.reduce((acc, s) => acc + countSub(activeTab, s), 0);
  const allBtn = document.createElement('button');
  allBtn.className = 'tab-secondary all-btn' + (activeSub === 'ALL' ? ' active' : '');
  allBtn.innerHTML = 'TODOS <span class="count">' + allCount + '</span>';
  allBtn.onclick = () => { activeSub = 'ALL'; renderSecondaryTabs(); renderActive(); renderTotalesFooter(); };
  el.appendChild(allBtn);

  subs.forEach(sub => {
    const count = countSub(activeTab, sub);
    const btn = document.createElement('button');
    btn.className = 'tab-secondary' + (sub === activeSub ? ' active' : '') + (count === 0 ? ' empty' : '');
    btn.innerHTML = sub + ' <span class="count">' + count + '</span>';
    btn.onclick = () => { activeSub = sub; renderSecondaryTabs(); renderActive(); renderTotalesFooter(); };
    el.appendChild(btn);
  });
}

const COLGROUP_MAIN = '<colgroup><col class="c-cod"><col class="c-desc"><col class="c-stock"><col class="c-oc"><col class="c-saldo"><col class="c-ocdif"></colgroup>';
const COLGROUP_NEW = '<colgroup><col class="c-cod"><col class="c-desc"><col class="c-stock"><col class="c-origen"></colgroup>';

function rowHTML(r) {
  const ocDifClass = r.ocDif >= 0 ? 'ocdif-cubierto' : 'ocdif-falta';
  return '<tr>' +
    '<td>' + r.cod + '</td>' +
    '<td>' + r.desc + '</td>' +
    '<td class="neg">' + fmtNum(r.stockDisp) + '</td>' +
    '<td class="muted">' + (r.ords || '—') + '</td>' +
    '<td>' + (r.saldoEnviar ? fmtNum(r.saldoEnviar) : '—') + '</td>' +
    '<td class="' + ocDifClass + '">' + fmtNum(r.ocDif) + '</td>' +
    '</tr>';
}

function renderFamiliaBlocks(container, familias) {
  const famNames = Object.keys(familias).sort();
  famNames.forEach(fam => {
    const rows = familias[fam];
    const block = document.createElement('div');
    block.className = 'familia-block';
    block.innerHTML = '<div class="familia-title">' + fam + ' (' + rows.length + ')</div>';
    const table = document.createElement('table');
    table.className = 'tbl-main';
    table.innerHTML = COLGROUP_MAIN + '<thead><tr><th>Código</th><th>Descripción</th><th>Stock negativo</th><th>Nro OC</th><th>Saldo a enviar</th><th>OC DIF</th></tr></thead><tbody>' +
      rows.map(rowHTML).join('') + '</tbody>';
    block.appendChild(table);
    container.appendChild(block);
  });
}

function renderActive() {
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (activeTab === '__NEW__') {
    const list = STATE.newCodes || [];
    if (!list.length) {
      main.innerHTML = '<div class="empty-msg">No hay códigos nuevos sin clasificar. Todo lo que está en negativo ya pertenece a un grupo conocido.</div>';
      return;
    }
    const block = document.createElement('div');
    block.className = 'familia-block';
    block.innerHTML = '<div class="familia-title">Códigos con stock negativo que no están clasificados en ningún grupo (' + list.length + ')</div>';
    const table = document.createElement('table');
    table.className = 'tbl-new';
    table.innerHTML = COLGROUP_NEW + '<thead><tr><th>Código</th><th>Descripción</th><th>Stock negativo</th><th>Encontrado en</th></tr></thead><tbody>' +
      list.map(r => '<tr><td>' + r.cod + '</td><td>' + r.desc + '</td><td class="neg">' + fmtNum(r.stockDisp) + '</td><td class="muted">' + r.origen + '</td></tr>').join('') +
      '</tbody>';
    block.appendChild(table);
    main.appendChild(block);
    return;
  }

  const subs = TAB_SUBS[activeTab] || [activeTab];
  const tabData = STATE.data[activeTab] || {};

  if (subs.length <= 1) {
    const familias = tabData[subs[0]] || {};
    if (!Object.keys(familias).length) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en este segmento. 🎉</div>';
      return;
    }
    renderFamiliaBlocks(main, familias);
    return;
  }

  if (activeSub === 'ALL') {
    let anyContent = false;
    subs.forEach(sub => {
      const familias = tabData[sub] || {};
      const count = Object.values(familias).reduce((acc, arr) => acc + arr.length, 0);
      if (count === 0) return;
      anyContent = true;
      const banner = document.createElement('div');
      banner.className = 'sub-banner';
      banner.textContent = sub + ' (' + count + ')';
      main.appendChild(banner);
      renderFamiliaBlocks(main, familias);
    });
    if (!anyContent) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en este segmento. 🎉</div>';
    }
  } else {
    const familias = tabData[activeSub] || {};
    if (!Object.keys(familias).length) {
      main.innerHTML = '<div class="empty-msg">Sin códigos negativos en ' + activeSub + '. 🎉</div>';
      return;
    }
    renderFamiliaBlocks(main, familias);
  }
}

function renderTotalesFooter() {
  const el = document.getElementById('totalesFooter');

  if (activeTab === '__NEW__') {
    const list = STATE.newCodes || [];
    const suma = STATE.sumaSinClasificar || 0;
    el.style.display = 'flex';
    let evoHtml = '';
    if (HISTORIAL_ROWS && HISTORIAL_ROWS.length) {
      const prevRow = findPrevRow(HISTORIAL_ROWS);
      if (prevRow && prevRow.hasOwnProperty('SIN CLASIFICAR')) {
        const ayer = parseNum(prevRow['SIN CLASIFICAR']);
        const delta = suma - ayer;
        const cls = delta >= 0 ? 'mejor' : 'peor';
        const txt = delta >= 0 ? '▲ mejoró ' + fmtNum(Math.abs(delta)) : '▼ empeoró ' + fmtNum(Math.abs(delta));
        evoHtml = '<div class="evo"><span class="lbl2">vs. último registro (' + (prevRow['FECHA']||'—') + '): ' + fmtNum(ayer) + '</span><span class="delta ' + cls + '">' + txt + '</span></div>';
      }
    }
    el.innerHTML =
      '<div class="item"><div class="num">' + list.length + '</div><div class="lbl">Códigos sin clasificar</div></div>' +
      '<div class="item"><div class="num neg">' + fmtNum(suma) + '</div><div class="lbl">Suma negativos sin clasificar</div></div>' +
      evoHtml;
    return;
  }

  const subs = TAB_SUBS[activeTab] || [activeTab];
  const tabData = STATE.data[activeTab] || {};
  let subsToSum = subs;
  if (subs.length > 1 && activeSub !== 'ALL') subsToSum = [activeSub];

  let count = 0, suma = 0;
  subsToSum.forEach(sub => {
    const familias = tabData[sub] || {};
    Object.values(familias).forEach(arr => {
      arr.forEach(r => { count++; suma += r.stockDisp; });
    });
  });

  el.style.display = 'flex';
  let evoHtml = '';
  // La evolución por segmento se registra a nivel de pestaña principal (los 8 segmentos),
  // por eso se muestra siempre en base al total de la pestaña, aunque estés filtrando un sub-cliente.
  if (HISTORIAL_ROWS && HISTORIAL_ROWS.length && HISTORIAL_ROWS[0].hasOwnProperty(activeTab)) {
    const prevRow = findPrevRow(HISTORIAL_ROWS);
    if (prevRow) {
      const ayer = parseNum(prevRow[activeTab]);
      const hoy = STATE.sumaPorTab[activeTab] || 0;
      const delta = hoy - ayer;
      const cls = delta >= 0 ? 'mejor' : 'peor';
      const txt = delta >= 0 ? '▲ mejoró ' + fmtNum(Math.abs(delta)) : '▼ empeoró ' + fmtNum(Math.abs(delta));
      evoHtml = '<div class="evo"><span class="lbl2">' + activeTab + ' vs. último registro (' + (prevRow['FECHA']||'—') + '): ' + fmtNum(ayer) + '</span><span class="delta ' + cls + '">' + txt + '</span></div>';
    }
  }

  el.innerHTML =
    '<div class="item"><div class="num">' + count + '</div><div class="lbl">Códigos negativos en esta vista</div></div>' +
    '<div class="item"><div class="num neg">' + fmtNum(suma) + '</div><div class="lbl">Suma total de negativos en esta vista</div></div>' +
    evoHtml;
}

function updateKPIs() {
  document.getElementById('kpiTotal').textContent = STATE.totalNegativos || 0;
  let segsConNeg = 0;
  TAB_ORDER.forEach(t => { if (countTab(t) > 0) segsConNeg++; });
  document.getElementById('kpiSegmentos').textContent = segsConNeg;
  document.getElementById('kpiNuevos').textContent = (STATE.newCodes || []).length;
  document.getElementById('kpiSinCobertura').textContent = STATE.sinCobertura || 0;
}


function tituloVistaActual() {
  if (activeTab === '__NEW__') return 'CÓDIGOS NUEVOS ENCONTRADOS';
  let t = activeTab;
  const subs = TAB_SUBS[activeTab] || [];
  if (subs.length > 1 && activeSub !== 'ALL') t += ' — ' + activeSub;
  return t;
}

async function captureCurrentView() {
  const btn = document.getElementById('captureBtn');
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Generando imagen...';
  let wrapper = null;
  try {
    wrapper = document.createElement('div');
    wrapper.className = 'capture-render';
    wrapper.style.position = 'fixed';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.zIndex = '-1';

    const titleDiv = document.createElement('div');
    titleDiv.className = 'capture-title';
    titleDiv.textContent = tituloVistaActual();
    wrapper.appendChild(titleDiv);

    const updatedDiv = document.createElement('div');
    updatedDiv.className = 'capture-updated';
    updatedDiv.textContent = document.getElementById('status').textContent;
    wrapper.appendChild(updatedDiv);

    wrapper.appendChild(document.getElementById('main').cloneNode(true));
    wrapper.appendChild(document.getElementById('totalesFooter').cloneNode(true));

    document.body.appendChild(wrapper);
    const canvas = await html2canvas(wrapper, { backgroundColor: '#ffffff', scale: 2 });
    document.body.removeChild(wrapper);
    wrapper = null;

    canvas.toBlob(async (blob) => {
      let copiado = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          copiado = true;
        }
      } catch (err) {
        console.error('No se pudo copiar al portapapeles:', err);
      }
      if (copiado) {
        mostrarAvisoCaptura('✅ Imagen copiada — pegala con Ctrl+V en WhatsApp.');
      } else {
        const link = document.createElement('a');
        link.download = 'stock-negativo-' + activeTab.replace(/[^a-zA-Z0-9]+/g, '_') + '.png';
        link.href = URL.createObjectURL(blob);
        link.click();
        mostrarAvisoCaptura('No se pudo copiar directo (navegador sin soporte) — se descargó la imagen.');
      }
      btn.disabled = false;
      btn.textContent = original;
    }, 'image/png');
  } catch (err) {
    console.error(err);
    if (wrapper && wrapper.parentNode) document.body.removeChild(wrapper);
    mostrarAvisoCaptura('Error al generar la imagen: ' + err.message);
    btn.disabled = false;
    btn.textContent = original;
  }
}

function mostrarAvisoCaptura(msg) {
  const el = document.getElementById('captureMsg');
  el.textContent = msg;
  el.style.display = 'inline-block';
  clearTimeout(window.__captureMsgTimeout);
  window.__captureMsgTimeout = setTimeout(() => { el.style.display = 'none'; }, 5000);
}

loadAll();
